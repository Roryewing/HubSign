# Free hosts put a web service to sleep after ~15 idle minutes; the first request then takes ~30-50 s. This pings the
# server every 10 minutes during working hours (weekdays, 07:00-18:00 Central) so customers never meet a cold start,
# while leaving the nights and weekends asleep to stay inside a free plan's monthly hours.
# Set the repository variable HUBSIGN_URL (Settings > Secrets and variables > Actions > Variables) to switch it on.
name: keepalive
on:
  schedule:
    - cron: "*/10 12-23 * * 1-5"
  workflow_dispatch:
jobs:
  ping:
    if: ${{ vars.HUBSIGN_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.HUBSIGN_URL }}/api/ping"
