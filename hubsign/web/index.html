<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HubSign</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234b2bd6'/%3E%3Cpath d='M8 21c4-9 6-9 6-3s3 3 10-5' stroke='%23ffd23f' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4fa;--surface:#fff;--ink:#150f33;--muted:#645f7d;--line:#e3e1ee;--hdr:#fff;--primary:#4b2bd6;--primary-h:#3c1fb8;--primary-ink:#fff;--primary-soft:#efecff;--sign:#ffd23f;--sign-ink:#2a2000;--ok:#127a4a;--ok-bg:#e1f5ea;--bad:#b3261e;--bad-bg:#fce8e6;--warn:#8a5a00;--warn-bg:#fff2d1;--mute-bg:#eeedf6;--code:#120e2a;--code-ink:#e2dcff;--shadow:0 1px 2px rgba(21,15,51,.06),0 6px 18px rgba(21,15,51,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0b1f;--surface:#171331;--ink:#ece9fb;--muted:#a09bbd;--line:#2b2650;--hdr:#120f28;--primary:#8d78ff;--primary-h:#a595ff;--primary-ink:#0e0b1f;--primary-soft:#241e4d;--ok:#5fd69b;--ok-bg:#12332a;--bad:#ff8f87;--bad-bg:#3b1c20;--warn:#ffd27a;--warn-bg:#3a3012;--mute-bg:#1f1a40;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e0b1f;--surface:#171331;--ink:#ece9fb;--muted:#a09bbd;--line:#2b2650;--hdr:#120f28;--primary:#8d78ff;--primary-h:#a595ff;--primary-ink:#0e0b1f;--primary-soft:#241e4d;--ok:#5fd69b;--ok-bg:#12332a;--bad:#ff8f87;--bad-bg:#3b1c20;--warn:#ffd27a;--warn-bg:#3a3012;--mute-bg:#1f1a40;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:600}h2{font-size:16px;margin:0 0 4px;font-weight:600}h3{font-size:11.5px;margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.mono,code,pre{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12.5px}
header.top{background:var(--hdr);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 max(20px,env(safe-area-inset-left));height:60px;position:sticky;top:0;z-index:30;flex-wrap:nowrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.02em;margin-right:26px;color:var(--ink)!important;text-decoration:none!important;white-space:nowrap}
header.top a.nl{color:var(--muted);padding:19px 14px 17px;font-weight:500;border-bottom:3px solid transparent;text-decoration:none;white-space:nowrap}
header.top a.nl:hover{color:var(--ink)}header.top a.nl.on{color:var(--ink);border-bottom-color:var(--primary);font-weight:600}
.sp{flex:1}
.seg{display:inline-flex;background:var(--mute-bg);border-radius:9px;padding:3px;margin-right:10px}
.seg button{background:none;border:0;color:var(--muted);padding:5px 11px;border-radius:7px;font:inherit;font-weight:600;font-size:12.5px;cursor:pointer}.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.menuwrap{position:relative}.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(21,15,51,.18);min-width:230px;padding:6px;z-index:40}
.menu a,.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-radius:8px;color:var(--ink);background:none;border:0;font:inherit;text-align:left;cursor:pointer;text-decoration:none}.menu a:hover,.menu button:hover{background:var(--mute-bg);text-decoration:none}.menu .who{padding:8px 12px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line);margin-bottom:4px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;font-size:13px;border:0;cursor:pointer}
.banner{background:var(--warn-bg);color:var(--warn);text-align:center;padding:6px 16px;font-size:12.5px;font-weight:500}
main{max-width:1180px;margin:0 auto;padding:28px max(20px,env(safe-area-inset-left)) 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sub{color:var(--muted);margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card+.card{margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.grid4{grid-template-columns:1fr 1fr}}@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none!important;white-space:nowrap}
.btn:hover{border-color:var(--primary)}.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}.btn.primary:hover{background:var(--primary-h)}
.btn.danger{color:var(--bad)}.btn.sm{padding:4px 12px;font-size:12.5px}.btn[disabled]{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{border-collapse:collapse;width:100%}th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--mute-bg)}
.scroll{overflow-x:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--mute-bg);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.pill.sent,.pill.viewed{background:var(--primary-soft);color:var(--primary)}.pill.completed,.pill.signed,.pill.delivered{background:var(--ok-bg);color:var(--ok)}
.pill.declined,.pill.failed,.pill.voided{background:var(--bad-bg);color:var(--bad)}.pill.retrying,.pill.pending,.pill.draft{background:var(--warn-bg);color:var(--warn)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 14px;border-radius:9px;margin:10px 0;font-weight:500}
.ok{background:var(--ok-bg);color:var(--ok);padding:10px 14px;border-radius:9px;margin:10px 0;font-weight:500}
pre{background:var(--code);color:var(--code-ink);padding:14px;border-radius:10px;overflow-x:auto;margin:8px 0;white-space:pre}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}.tabs a.on{color:var(--ink);border-color:var(--primary);text-decoration:none}
/* home */
.tile{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--ink);text-decoration:none!important;box-shadow:var(--shadow)}.tile:hover{border-color:var(--primary)}
.tile b{display:block;font-size:34px;line-height:1.1;letter-spacing:-.02em;font-weight:600}.tile span{color:var(--muted);font-weight:500}
.start{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--ink);text-decoration:none!important;box-shadow:var(--shadow)}.start:hover{border-color:var(--primary)}
.start .ic{width:54px;height:54px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}.start b{font-size:16px}.start p{margin:2px 0 0;color:var(--muted)}
/* agreements */
.ag{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}@media(max-width:820px){.ag{grid-template-columns:1fr}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}.side h3{padding:8px 10px}
.side a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--ink);font-weight:500;text-decoration:none}.side a:hover{background:var(--mute-bg)}.side a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}.side a i{font-style:normal;color:var(--muted);font-weight:500}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar input[type=search]{max-width:340px;border-radius:99px;padding-left:16px}
/* detail */
.track{display:flex;align-items:center;margin:4px 0 4px}.track .s{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;min-width:84px;color:var(--muted);font-weight:600;font-size:12.5px}
.track .s i{width:26px;height:26px;border-radius:50%;background:var(--mute-bg);display:grid;place-items:center;font-style:normal;font-size:13px}.track .s.on i{background:var(--primary);color:var(--primary-ink)}.track .s.on{color:var(--ink)}.track .s.ok i{background:var(--ok);color:#fff}.track .s.bad i{background:var(--bad);color:#fff}
.track .bar{flex:1;height:3px;background:var(--line);margin-bottom:22px}.track .bar.on{background:var(--primary)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.tl li:last-child{border:0}.tl time{color:var(--muted);width:150px;flex:none;font-size:12.5px}
.pdfwrap{display:flex;flex-direction:column;align-items:center;gap:14px;background:var(--mute-bg);padding:16px;border-radius:12px;overflow:auto;max-height:80vh}
.pg{position:relative;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);cursor:crosshair;flex:none;max-width:100%}.pg canvas{display:block}
/* composer */
.stepper{display:flex;gap:0;margin-bottom:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper .st{flex:1;padding:12px 16px;display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:600;border-right:1px solid var(--line);white-space:nowrap}.stepper .st:last-child{border:0}
.stepper .st b{width:24px;height:24px;border-radius:50%;background:var(--mute-bg);display:grid;place-items:center;font-size:12px}.stepper .st.on{color:var(--ink);background:var(--primary-soft)}.stepper .st.on b{background:var(--primary);color:var(--primary-ink)}.stepper .st.done b{background:var(--ok);color:#fff}
@media(max-width:700px){.stepper .st span{display:none}}
.drop{border:2px dashed var(--line);border-radius:14px;padding:34px 16px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface)}.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}.drop b{display:block;color:var(--ink);font-size:15px}
.editor{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}@media(max-width:820px){.editor{grid-template-columns:1fr}}
.pal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:76px}
.pal h3{margin:12px 0 6px}.pal h3:first-child{margin-top:0}
.rchip{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;margin-bottom:6px;font-weight:500}.rchip.on{border-color:var(--primary);background:var(--primary-soft)}.rchip .dot{width:12px;height:12px;border-radius:3px;flex:none}
.ptool{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:grab;margin-bottom:6px;text-align:left}.ptool:hover{border-color:var(--primary)}.ptool.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}.ptool span{width:20px;text-align:center;font-weight:700;color:var(--muted)}
.fb{position:absolute;border:2px solid;border-radius:4px;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:#111}.fb:hover::after{content:"×";position:absolute;top:-1px;right:3px;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.modalbg{position:fixed;inset:0;background:rgba(10,6,30,.55);display:grid;place-items:center;z-index:60;padding:16px}.modalbg .box{background:var(--surface);border-radius:16px;padding:24px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.auth{max-width:420px;margin:9vh auto;padding:0 16px}.auth .logo{font-size:26px;margin-bottom:6px}
@media(max-width:700px){.tl time{width:96px}header.top a.nl{padding:19px 8px 17px}.logo{margin-right:8px}.logo span{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet=(k,d)=>{try{return localStorage.getItem(k)??d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const state={me:null,mode:lsGet("hs_mode","test"),org:lsGet("hs_org",""),composer:null};
const AUTHM={none:"Link only",access_code:"Access code",sms:"SMS code",email:"Email code"};
const can=l=>({viewer:1,sender:2,admin:3,owner:4}[state.me?.role]||0)>=({viewer:1,sender:2,admin:3,owner:4}[l]);
const COLORS=["#ffd966","#9fd8ff","#b7f0b1","#ffb3c7","#d4b8ff","#ffc999"];
const SIZE={signature:[.25,.06],initials:[.08,.05],date:[.15,.03],name:[.22,.03],email:[.28,.03],text:[.25,.03],checkbox:[.025,.02]};
const TYPES={signature:"Signature",initials:"Initial",date:"Date Signed",name:"Name",email:"Email",text:"Text",checkbox:"Checkbox"};
const GLYPH={signature:"✍",initials:"AB",date:"▦",name:"A",email:"@",text:"T",checkbox:"☑"};
const ago=t=>{if(!t)return"";const s=(Date.now()-new Date(t))/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" hr ago";if(s<604800)return Math.floor(s/86400)+" d ago";return new Date(t).toLocaleDateString([], {dateStyle:"medium"})};
const when=t=>t?new Date(t).toLocaleString([], {dateStyle:"medium",timeStyle:"short"}):"";
const LABEL={sent:"Waiting for others",draft:"Draft",completed:"Completed",declined:"Declined",voided:"Voided"};
const pill=(s,l)=>`<span class="pill ${esc(s)}">${esc(l||LABEL[s]||s)}</span>`;
const copyText=async t=>{try{await navigator.clipboard.writeText(t);return true}catch{return false}};
const ICON={send:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',tpl:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>'};
const MARK=(bg,fg)=>`<svg width="28" height="28" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="${bg}"/><path d="M8 21c4-9 6-9 6-3s3 3 10-5" stroke="${fg}" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>`;

async function api(path,opt={}){
  const o={credentials:"same-origin",...opt,headers:{"X-HubSign-Mode":state.mode,...(state.org?{"X-HubSign-Org":state.org}:{}),...(opt.body?{"Content-Type":"application/json"}:{}),...(opt.headers||{})}};
  if(opt.body&&typeof opt.body!=="string")o.body=JSON.stringify(opt.body);
  const r=await fetch(path,o);
  if(r.status===204)return null;
  let j=null;try{j=await r.json()}catch{}
  if(!r.ok){
    if(r.status===401&&!path.startsWith("/auth/")){state.me=null;route()}
    const d=j&&j.detail;
    throw new Error(Array.isArray(d)?d.map(x=>(x.loc||[]).slice(1).join(".")+": "+x.msg).join("; "):d||r.statusText);
  }
  return j;
}
const flash=(msg,bad)=>{const el=$("#flash");if(el){el.innerHTML=msg?`<div class="${bad?"err":"ok"}">${esc(msg)}</div>`:""}};

/* ---------- shell ---------- */
function shell(active,inner){
  const nav=[["home","Home"],["agreements","Agreements"],["templates","Templates"],["developer","Developer"]];
  const ini=(state.me.name||state.me.email).split(/[\s@.]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("");
  return `<header class="top"><a class="logo" href="#home">${MARK("#4b2bd6","#ffd23f")}<span>HubSign</span></a>
  ${nav.map(([k,l])=>`<a class="nl ${active===k?"on":""}" href="#${k}">${l}</a>`).join("")}<span class="sp"></span>
  <span class="seg" title="Sandbox documents are watermarked and not legally binding"><button data-mode="test" class="${state.mode==="test"?"on":""}">Sandbox</button><button data-mode="live" class="${state.mode==="live"?"on":""}">Live</button></span>
  ${can("sender")?`<span class="menuwrap"><button class="btn primary" id="startbtn">Start ▾</button><div class="menu" id="startmenu" hidden><a href="#new">${ICON.send.replace('width="26" height="26"','width="18" height="18"')} Send an Envelope</a><a href="#templates">${ICON.tpl.replace('width="26" height="26"','width="18" height="18"')} Use a Template</a><a href="#new/template">${ICON.tpl.replace('width="26" height="26"','width="18" height="18"')} Create a Template</a></div></span>`:""}
  <span class="menuwrap" style="margin-left:12px"><button class="avatar" id="avbtn" aria-label="Account">${esc(ini)}</button><div class="menu" id="avmenu" hidden><div class="who"><b>${esc(state.me.name)}</b><br>${esc(state.me.email)}<br><span class="pill">${esc(state.me.role)}</span></div>${state.me.orgs.map(o=>`<button data-org="${esc(o.id)}">${o.id===state.me.org?"✓ ":"&nbsp;&nbsp;&nbsp;"}${esc(o.name)}</button>`).join("")}<a href="#team">Team &amp; organisations</a><a href="#developer">API keys &amp; webhooks</a><button id="logout">Sign out</button></div></span></header>
  ${state.mode==="test"?`<div class="banner">Sandbox: documents are watermarked and are not legally binding. Signing links are returned to you here and in the API.</div>`:""}
  <main><div id="flash"></div>${inner}</main>`;
}
function bindShell(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;lsSet("hs_mode",state.mode);state.composer=null;route()});
  const toggle=(btn,menu)=>{$(btn).onclick=e=>{e.stopPropagation();const m=$(menu),show=m.hidden;document.querySelectorAll(".menu").forEach(x=>x.hidden=true);m.hidden=!show}};
  if($("#startbtn"))toggle("#startbtn","#startmenu");toggle("#avbtn","#avmenu");
  document.querySelectorAll("[data-org]").forEach(b=>b.onclick=()=>{state.org=b.dataset.org;lsSet("hs_org",state.org);state.me=null;state.composer=null;route()});
  document.onclick=()=>document.querySelectorAll(".menu").forEach(x=>x.hidden=true);
  $("#logout").onclick=async e=>{e.preventDefault();await api("/auth/logout",{method:"POST"}).catch(()=>{});state.me=null;route()};
}

/* ---------- auth ---------- */
function authView(signup,invite){
  $("#app").innerHTML=`<div class="auth"><a class="logo" style="margin:0 0 6px">${MARK("#4b2bd6","#ffd23f")}HubSign</a>
  <p class="sub">${invite?"You were invited to a team. Create your account with the email the invitation was sent to.":signup?"Create your account to start sending agreements":"Log in to send and sign agreements"}</p><div class="card" style="margin-top:18px"><form id="af" class="row" style="flex-direction:column;align-items:stretch;gap:14px">
  ${signup?`<label class="f">Full name<input name="name" autocomplete="name"></label>`:""}${invite?`<input type="hidden" name="invite_token" value="${esc(invite)}">`:""}
  <label class="f">Email<input name="email" type="email" required autocomplete="username"></label>
  <label class="f">Password${signup?" (8+ characters)":""}<input name="password" type="password" required minlength="8" autocomplete="${signup?"new-password":"current-password"}"></label>
  <div id="flash"></div><button class="btn primary" style="justify-content:center;padding:11px">${signup?"Create account":"Log in"}</button></form></div>

/* ---------- pdf rendering ---------- */
async function renderPdf(host,bytes,onPage){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
  host.innerHTML="";const pages=[];
  for(let n=1;n<=pdf.numPages;n++){
    const p=await pdf.getPage(n),W=Math.min(760,host.clientWidth-40||760),vp0=p.getViewport({scale:1}),sc=W/vp0.width,vp=p.getViewport({scale:sc*(devicePixelRatio||1)});
    const wrap=document.createElement("div");wrap.className="pg";wrap.dataset.page=n;wrap.style.width=W+"px";wrap.style.height=(vp0.height*sc)+"px";
    const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;c.style.width="100%";c.style.height="100%";wrap.appendChild(c);host.appendChild(wrap);
    await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;pages.push(wrap);onPage&&onPage(wrap,n);
  }
  return pages;
}
const b64=buf=>{let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};

function parseCsv(text){
  const rows=[];for(const line of text.split(/\r?\n/)){if(!line.trim())continue;const cells=[];let cur="",q=false;
    for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===","){cells.push(cur.trim());cur=""}else cur+=ch}
    cells.push(cur.trim());rows.push(cells)}
  return rows;
}

  $("#no").onsubmit=go(async e=>{const r=await api("/v1/orgs",{method:"POST",body:{name:new FormData(e.target).get("name")}});state.org=r.id;lsSet("hs_org",r.id);state.me=null;location.hash="#home";await route()});

/* ---------- composer (envelope + template) ---------- */
function newComposer(kind){return {kind,step:1,bytes:null,name:"",subject:"",message:"",tplName:"",tplDesc:"",sequential:true,recipients:[{name:"",email:"",role:"signer",routing_order:1}],fields:[],tool:{recipient:0,type:"signature"},pages:0}}
function composerView(kind){
  let c=state.composer;if(!c||(kind&&c.kind!==kind))c=state.composer=newComposer(kind||"envelope");
  const tpl=c.kind==="template",steps=["Add documents","Add recipients","Add fields",tpl?"Save template":"Review & send"];
  const signers=()=>c.recipients.map((r,i)=>({...r,i})).filter(r=>r.role==="signer");
  const body={
    1:()=>`<div class="grid2" style="align-items:start"><div><label class="drop" id="drop"><input type="file" id="file" accept="application/pdf,.pdf" hidden><b>${c.bytes?esc(c.name):"Drag a PDF here or click to browse"}</b>${c.bytes?`${c.pages} page${c.pages>1?"s":""} loaded. Click to replace.`:"Up to 10 MB, unencrypted PDFs only"}</label></div>
      <div class="card row" style="flex-direction:column;align-items:stretch;gap:12px">${tpl?`<label class="f">Template name<input id="tname" value="${esc(c.tplName)}" maxlength="120" placeholder="Equipment lease"></label><label class="f">Description<textarea id="tdesc" rows="3" maxlength="500">${esc(c.tplDesc)}</textarea></label>`:`<label class="f">Email subject<input id="subject" value="${esc(c.subject)}" maxlength="200" placeholder="Please sign: Equipment lease"></label><label class="f">Email message<textarea id="message" rows="4" maxlength="2000">${esc(c.message)}</textarea></label>`}</div></div>`,
    2:()=>`<div class="card"><div class="scroll"><table><thead><tr><th>${tpl?"Role name":"Name"}</th>${tpl?"":"<th>Email</th>"}<th>Action</th><th>Identity check</th><th>Order</th><th></th></tr></thead><tbody>${c.recipients.map((r,i)=>`<tr><td><span class="dot" style="background:${COLORS[i%6]}"></span><input style="width:calc(100% - 18px)" data-r="${i}" data-k="name" value="${esc(r.name)}" placeholder="${tpl?"Tenant":"Full name"}"></td>${tpl?"":`<td><input data-r="${i}" data-k="email" type="email" value="${esc(r.email)}" placeholder="name@company.com"></td>`}<td><select data-r="${i}" data-k="role"><option value="signer" ${r.role==="signer"?"selected":""}>Needs to sign</option><option value="cc" ${r.role==="cc"?"selected":""}>Receives a copy</option></select></td><td style="min-width:190px">${r.role==="signer"?`<select data-r="${i}" data-k="am"><option value="none" ${(r.am||"none")==="none"?"selected":""}>Link only</option><option value="access_code" ${r.am==="access_code"?"selected":""}>Access code</option><option value="sms" ${r.am==="sms"?"selected":""}>SMS code</option><option value="email" ${r.am==="email"?"selected":""}>Email code</option></select>${!tpl&&r.am==="access_code"?`<input data-r="${i}" data-k="ac" value="${esc(r.ac||"")}" placeholder="Code to share with them" maxlength="64" style="margin-top:4px">`:""}${!tpl&&r.am==="sms"?`<input data-r="${i}" data-k="ph" value="${esc(r.ph||"")}" placeholder="+14165550123" maxlength="20" style="margin-top:4px">`:""}`:""}</td><td style="width:90px"><input data-r="${i}" data-k="routing_order" type="number" min="1" max="20" value="${r.routing_order}"></td><td>${c.recipients.length>1?`<button class="btn sm danger" data-rm="${i}">Remove</button>`:""}</td></tr>`).join("")}</tbody></table></div>
      <div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn sm" id="addr">+ Add recipient</button><label class="row" style="gap:8px"><input type="checkbox" id="seq" ${c.sequential?"checked":""}> Set signing order</label></div></div>`,
    3:()=>`<div class="editor"><aside class="pal"><h3>Recipient</h3>${signers().map(r=>`<div class="rchip ${c.tool.recipient===r.i?"on":""}" data-rc="${r.i}"><span class="dot" style="background:${COLORS[r.i%6]}"></span>${esc(r.name||"Recipient "+(r.i+1))}</div>`).join("")}
      <h3>Standard fields</h3>${Object.entries(TYPES).map(([k,l])=>`<button class="ptool ${c.tool.type===k?"on":""}" draggable="true" data-ft="${k}"><span>${GLYPH[k]}</span>${l}</button>`).join("")}<p class="sub" style="font-size:12.5px;margin-top:8px">Drag a field onto the page, or pick one and click. Click a placed field to remove it.</p></aside>
      <div class="pdfwrap" id="pdf"><span class="sub">Rendering…</span></div></div>`,
    4:()=>tpl?`<div class="card"><h2>${esc(c.tplName)}</h2><p class="sub">${esc(c.name)} · ${c.pages} pages · ${c.recipients.length} role${c.recipients.length>1?"s":""} · ${c.fields.length} fields</p><div id="flash"></div><button class="btn primary" id="savetpl">Save template</button></div>`:
      `<div class="card"><h2>${esc(c.subject)}</h2><p class="sub">${esc(c.name)} · ${c.pages} pages · ${c.sequential?"signing in order":"all at once"}</p><table><tbody>${c.recipients.map((r,i)=>`<tr><td><span class="dot" style="background:${COLORS[i%6]}"></span><b>${esc(r.name)}</b> <span class="sub">${esc(r.email)}</span></td><td>${r.role==="signer"?"Needs to sign":"Receives a copy"} · step ${r.routing_order}${r.role==="signer"&&r.am&&r.am!=="none"?` · ${AUTHM[r.am]}`:""}</td><td>${r.role==="signer"?c.fields.filter(f=>f.recipient===i).map(f=>TYPES[f.type]).join(", ")||'<span style="color:var(--bad)">no fields</span>':""}</td></tr>`).join("")}</tbody></table>
      <div id="flash"></div><div class="row" style="margin-top:14px"><button class="btn" id="draft">Save as draft</button><button class="btn primary" id="sendnow">Send</button></div></div>`
  };
  $("#app").innerHTML=shell("new",`<div class="head"><div><h1>${tpl?"Create a Template":"Send an Envelope"}</h1><p class="sub">${state.mode==="test"?"Sandbox":"Live"} mode</p></div><button class="btn sm" id="reset">Start over</button></div>
  <div class="stepper">${steps.map((s,i)=>`<div class="st ${c.step===i+1?"on":c.step>i+1?"done":""}"><b>${c.step>i+1?"✓":i+1}</b><span>${s}</span></div>`).join("")}</div>${body[c.step]()}
  <div class="row" style="margin-top:18px;justify-content:space-between"><button class="btn" id="back" ${c.step===1?"disabled":""}>Back</button>${c.step<4?`<button class="btn primary" id="next">Next</button>`:""}</div>`);
  bindShell();
  $("#reset").onclick=()=>{state.composer=null;composerView(c.kind)};
  $("#back").onclick=()=>{c.step--;composerView()};
  const go=n=>{c.step=n;composerView()};
  if(c.step===1){
    const load=async f=>{if(!f)return;if(f.size>10*1048576)return flash("That file is over 10 MB",true);
      try{const buf=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;c.bytes=buf;c.name=f.name;c.pages=pdf.numPages;c.fields=[];
        if(!tpl)c.subject=c.subject||"Please sign: "+f.name.replace(/\.pdf$/i,"");else c.tplName=c.tplName||f.name.replace(/\.pdf$/i,"");composerView()}catch{flash("That file could not be read as a PDF",true)}};
    $("#file").onchange=e=>load(e.target.files[0]);
    const dz=$("#drop");dz.ondragover=e=>{e.preventDefault();dz.classList.add("over")};dz.ondragleave=()=>dz.classList.remove("over");dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");load(e.dataTransfer.files[0])};
    $("#next").onclick=()=>{if(tpl){c.tplName=$("#tname").value.trim();c.tplDesc=$("#tdesc").value}else{c.subject=$("#subject").value.trim();c.message=$("#message").value}
      if(!c.bytes)return flash("Choose a PDF first",true);if(tpl?!c.tplName:!c.subject)return flash(tpl?"Name the template":"Add a subject",true);go(2)};
  }
  if(c.step===2){
    const sync=()=>document.querySelectorAll("[data-r]").forEach(i=>{const r=c.recipients[+i.dataset.r];r[i.dataset.k]=i.dataset.k==="routing_order"?Math.max(1,+i.value||1):i.value});
    document.querySelectorAll('[data-k="am"],[data-k="role"]').forEach(x=>x.onchange=()=>{sync();composerView()});
    $("#addr").onclick=()=>{sync();c.recipients.push({name:"",email:"",role:"signer",routing_order:c.recipients.length+1});composerView()};
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{sync();const i=+b.dataset.rm;c.recipients.splice(i,1);c.fields=c.fields.filter(f=>f.recipient!==i).map(f=>({...f,recipient:f.recipient>i?f.recipient-1:f.recipient}));composerView()});
    $("#next").onclick=()=>{sync();c.sequential=$("#seq").checked;
      if(c.recipients.some(r=>!r.name.trim()||(!tpl&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email))))return flash(tpl?"Every role needs a name":"Every recipient needs a name and a valid email",true);
      if(!c.recipients.some(r=>r.role==="signer"))return flash("Add at least one recipient who needs to sign",true);
      if(!tpl){const bad=c.recipients.find(r=>r.role==="signer"&&((r.am==="access_code"&&(r.ac||"").length<4)||(r.am==="sms"&&!/^\+[1-9]\d{7,14}$/.test((r.ph||"").replace(/\s/g,"")))));
        if(bad)return flash(bad.am==="sms"?`${bad.name} needs a phone number like +14165550123`:`${bad.name} needs an access code of at least 4 characters`,true)}
      c.fields=c.fields.filter(f=>c.recipients[f.recipient]?.role==="signer");c.tool.recipient=signers()[0].i;go(3)};
  }
  if(c.step===3){
    document.querySelectorAll("[data-rc]").forEach(e=>e.onclick=()=>{c.tool.recipient=+e.dataset.rc;document.querySelectorAll("[data-rc]").forEach(x=>x.classList.toggle("on",x===e))});
    document.querySelectorAll("[data-ft]").forEach(b=>{b.onclick=()=>{c.tool.type=b.dataset.ft;document.querySelectorAll("[data-ft]").forEach(x=>x.classList.toggle("on",x===b))};b.ondragstart=e=>{c.tool.type=b.dataset.ft;e.dataTransfer?.setData("text/plain",b.dataset.ft)}});
    let pages=[];
    const draw=wrap=>{wrap.querySelectorAll(".fb").forEach(x=>x.remove());
      c.fields.forEach((f,idx)=>{if(f.page!==+wrap.dataset.page)return;const b=document.createElement("div");b.className="fb";b.style.cssText=`left:${f.x*100}%;top:${f.y*100}%;width:${f.w*100}%;height:${f.h*100}%;background:${COLORS[f.recipient%6]}cc;border-color:${COLORS[f.recipient%6]}`;b.textContent=TYPES[f.type];
        b.onclick=e=>{e.stopPropagation();c.fields.splice(idx,1);pages.forEach(draw)};wrap.appendChild(b)})};
    const place=(wrap,e)=>{const r=wrap.getBoundingClientRect(),[w,h]=SIZE[c.tool.type];
      const x=Math.min(Math.max((e.clientX-r.left)/r.width-w/2,0),1-w),y=Math.min(Math.max((e.clientY-r.top)/r.height-h/2,0),1-h);
      c.fields.push({recipient:c.tool.recipient,type:c.tool.type,page:+wrap.dataset.page,x:+x.toFixed(4),y:+y.toFixed(4),w,h,required:c.tool.type!=="checkbox",label:""});pages.forEach(draw)};
    renderPdf($("#pdf"),new Uint8Array(c.bytes),wrap=>{wrap.onclick=e=>place(wrap,e);wrap.ondragover=e=>e.preventDefault();wrap.ondrop=e=>{e.preventDefault();const t=e.dataTransfer?.getData("text/plain");if(SIZE[t])c.tool.type=t;place(wrap,e)};pages.push(wrap);draw(wrap)}).catch(()=>flash("Could not render the PDF",true));
    $("#next").onclick=()=>{const missing=signers().find(r=>!c.fields.some(f=>f.recipient===r.i&&["signature","initials"].includes(f.type)));
      if(missing)return flash(`${missing.name||"A recipient"} needs at least one Signature or Initial field`,true);go(4)};
  }
  if(c.step===4){
    const common=()=>({document_base64:b64(c.bytes),document_name:c.name,fields:c.fields,sequential:c.sequential});
    if(tpl)$("#savetpl").onclick=async()=>{try{await api("/v1/templates",{method:"POST",body:{...common(),name:c.tplName,description:c.tplDesc,roles:c.recipients.map(r=>({name:r.name.trim(),role:r.role,routing_order:r.routing_order,authentication:{method:r.role==="signer"?(r.am||"none"):"none"}}))}});state.composer=null;location.hash="#templates"}catch(x){flash(x.message,true)}};
    else{const submit=async send=>{try{const r=await api("/v1/envelopes",{method:"POST",body:{...common(),subject:c.subject,message:c.message,recipients:c.recipients.map(r=>({name:r.name.trim(),email:r.email,role:r.role,routing_order:r.routing_order,authentication:{method:r.role==="signer"?(r.am||"none"):"none",access_code:r.am==="access_code"?r.ac:null,phone:r.am==="sms"?(r.ph||"").replace(/\s/g,""):null}})),send}});state.composer=null;location.hash="#env/"+r.id}catch(x){flash(x.message,true)}};
      $("#draft").onclick=()=>submit(false);$("#sendnow").onclick=()=>submit(true)}
  }
}

    fields=[{"recipient": 0, "type": "signature", "page": 1, "x": 0.1, "y": 0.85}], send=True)
print(env["recipients"][0]["signing_url"])
hs.download_signed(env["id"], "nda-signed.pdf")   # after status == completed</pre></div>
<div class="card"><h2>Webhooks</h2><p class="sub">Each delivery is a JSON POST with these headers. Reject anything older than five minutes.</p>
<pre>HubSign-Event:      envelope.completed
HubSign-Delivery:   del_9f2c...
HubSign-Signature:  t=1767225600,v1=5257a869e7ec...   # HMAC-SHA256 of "{t}.{raw body}" with your signing secret</pre>
<pre>from hubsign.sdk import verify_signature
verify_signature(secret, request.headers["HubSign-Signature"], raw_body)   # raises ValueError if invalid or stale

// Node
const mac = crypto.createHmac("sha256", secret).update(t + "." + rawBody).digest("hex");
if (!crypto.timingSafeEqual(Buffer.from(mac), Buffer.from(v1))) throw new Error("bad signature");</pre>
<p class="sub">Failed deliveries (non-2xx or timeout) retry after 5 s, 1 min and 10 min. Every attempt is in the Deliveries log, and you can redeliver any event.</p>
<h3 style="margin-top:14px">Events</h3><p class="mono">envelope.sent · envelope.completed · envelope.declined · envelope.voided · recipient.sent · recipient.viewed · recipient.signed · recipient.declined</p></div>
<div class="card"><h2>Identity checks</h2><p class="sub">Add <span class="mono">authentication</span> to a recipient to require more than the link.</p>
<pre>"recipients":[{"name":"Ann Lee","email":"ann@example.com",
  "authentication":{"method":"sms","phone":"+14165550123"}}]      // or "access_code" with "access_code":"..." or "email"</pre>
<p class="sub">Access codes are hashed and never shown again, so share them yourself. SMS and email send a six-digit code valid for 10 minutes. Five wrong attempts lock the recipient for 15 minutes. In the sandbox no message is sent and the code is always <span class="mono">000000</span>. The certificate of completion records the method and when it was verified.</p></div>
<div class="card"><h2>Sealing and verification</h2><p class="sub">Every completed PDF carries a PAdES certification signature. Changing even one byte breaks it, and Adobe Acrobat will say so. Anyone can check a file, no account needed:</p>
<pre>curl -s ${esc(base)}/v1/verify -H "Content-Type: application/pdf" --data-binary @signed.pdf</pre>
<p class="sub">Or drop it on <a href="/verify" target="_blank">${esc(base)}/verify</a>. To have Acrobat show a trusted signer, load your own document-signing certificate (see the README). The server's current seal certificate is at <a href="/.well-known/hubsign-seal.pem">/.well-known/hubsign-seal.pem</a>.</p></div>
<div class="card"><h2>Limits</h2><p class="sub">Requests are limited per API key (600 a minute by default). A <span class="mono">429</span> response carries <span class="mono">Retry-After</span>; every response carries <span class="mono">X-RateLimit-Remaining</span>. Bulk send accepts up to 500 envelopes per batch: <span class="mono">POST /v1/templates/{id}/bulk</span>, then poll <span class="mono">GET /v1/batches/{id}</span>.</p></div>
<div class="card scroll"><h2>Endpoints</h2><table><tbody>
${[["POST","/v1/envelopes","Create (and optionally send) an envelope"],["GET","/v1/envelopes","List, filter by status"],["GET","/v1/envelopes/{id}","Status, recipients, signing links, fields"],["POST","/v1/envelopes/{id}/send","Send a draft"],["POST","/v1/envelopes/{id}/void","Cancel a sent envelope"],["GET","/v1/envelopes/{id}/events","Audit trail"],["GET","/v1/envelopes/{id}/signed","Signed PDF with certificate"],["GET","/v1/envelopes/counts","Counts per status"],["POST","/v1/templates","Create a template (roles + fields)"],["POST","/v1/templates/{id}/envelopes","Send a template to real people"],["POST","/v1/templates/{id}/bulk","Send a template to up to 500 people"],["GET","/v1/batches/{id}","Bulk batch progress and errors"],["POST","/v1/verify","Check a sealed PDF (public)"],["GET","/v1/org","Members and invitations"],["POST","/v1/webhooks","Register an endpoint"],["POST","/v1/webhooks/{id}/test","Send a test event"],["GET","/v1/webhooks/{id}/deliveries","Delivery log"]].map(r=>`<tr><td class="mono" style="width:70px"><b>${r[0]}</b></td><td class="mono">${r[1]}</td><td class="sub">${r[2]}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------- router ---------- */
async function route(){
  const [page,arg]=location.hash.replace(/^#/,"").split("/");
  if(!state.me){try{state.me=await api("/auth/me")}catch{if(state.org){state.org="";lsSet("hs_org","");try{state.me=await api("/auth/me")}catch{}}}}
  if(!state.me)return page==="invite"?authView(true,arg):authView(false);
  if(state.me.org!==state.org&&state.org){state.org=state.me.org;lsSet("hs_org",state.org)}else if(!state.org){state.org=state.me.org}
  try{
    if(page==="invite"&&arg)await inviteView(arg);
    else if(page==="team")await teamView();
    else if(page==="new")composerView(arg==="template"?"template":"envelope");
    else if(page==="env"&&arg)await detailView(arg);
    else if(page==="agreements")await agreementsView(arg||"");
    else if(page==="templates")await templatesView();
    else if(page==="developer")await developerView(arg||"keys");
    else await homeView();
  }catch(x){$("#app").innerHTML=shell("home",`<div class="err">${esc(x.message)}</div>`);bindShell()}
}
addEventListener("hashchange",route);route();
</script>
